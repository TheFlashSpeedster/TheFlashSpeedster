<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('speedster-theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <title>Atul Kumar | Portfolio</title>

    <!-- Meta SEO -->
    <meta name="description"
        content="Portfolio of Atul Kumar — Full-stack developer and Computer Science student at Lovely Professional University. Building clean, fast, and user-friendly web experiences.">
    <meta name="keywords"
        content="Atul Kumar, TheFlashSpeedster, Portfolio, Full-Stack Developer, CSE Student, LPU, React, JavaScript, Python, Web Development">
    <meta name="author" content="Atul Kumar">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Atul Kumar | Portfolio">
    <meta property="og:description"
        content="Second-year CSE student at LPU. Building clean, fast, and user-friendly web experiences.">

</head>
